# After each successful production deployment on Vercel, tell IndexNow search
# engines which addresses are new or changed. See docs/INDEXNOW.md.
#
# Vercel reports deployments to this repository as commit statuses (context
# "Vercel"), not as GitHub deployments, so this runs on the status event and
# only for a commit on main, which is what Vercel deploys to production.
name: IndexNow

on: status

permissions:
  contents: read

jobs:
  submit:
    if: >-
      github.event.context == 'Vercel' &&
      github.event.state == 'success' &&
      contains(github.event.branches.*.name, 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Date of the deployed commit
        id: commit
        run: echo "date=$(git log -1 --format=%cs)" >> "$GITHUB_OUTPUT"
      - name: Submit new and changed addresses
        run: node scripts/indexnow.ts
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://assocads-website.vercel.app' }}
          SINCE: ${{ steps.commit.outputs.date }}
